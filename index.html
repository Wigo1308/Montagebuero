<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Auftrags- & Montageverwaltung</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Work+Sans:wght@400;500;600&display=swap');

:root{
  --paper:#FAF6EE;
  --panel:#F1E9D8;
  --panel-raised:#F7F1E4;
  --ink:#2B2620;
  --ink-light:#726A5B;
  --amber:#B9701D;
  --amber-dark:#8F5714;
  --rust:#AE452E;
  --rust-bg:#F3DFD8;
  --slate:#3E6579;
  --slate-bg:#DCE7EA;
  --moss:#43713F;
  --moss-bg:#DEE9D6;
  --line:#DACCAF;
  --line-strong:#C6B692;
}

*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--paper);
  color:var(--ink);
  font-family:'Work Sans', sans-serif;
  font-size:15px;
  line-height:1.5;
}
h1,h2,h3,.label-font{
  font-family:'Oswald', sans-serif;
  font-weight:500;
  letter-spacing:0.01em;
}
button{font-family:'Work Sans', sans-serif;}
a{color:var(--amber-dark);}

#app{
  display:flex;
  min-height:100vh;
}

/* Sidebar */
.sidebar{
  width:210px;
  flex-shrink:0;
  background:var(--panel);
  border-right:1px solid var(--line-strong);
  padding:22px 0;
  display:flex;
  flex-direction:column;
}
.brand{
  font-family:'Oswald', sans-serif;
  font-size:19px;
  font-weight:600;
  padding:0 20px 18px 20px;
  border-bottom:1px solid var(--line);
  margin-bottom:10px;
  color:var(--ink);
}
.brand small{
  display:block;
  font-family:'Work Sans', sans-serif;
  font-size:11.5px;
  font-weight:400;
  color:var(--ink-light);
  margin-top:2px;
  letter-spacing:0;
}
.current-user{
  font-size:12.5px;
  color:var(--ink-light);
  padding:0 20px 14px 20px;
  border-bottom:1px solid var(--line);
  margin-bottom:6px;
}
.current-user strong{color:var(--ink); font-weight:600;}
.search-box{
  display:flex;
  align-items:center;
  gap:6px;
  padding:10px 20px 12px 20px;
  border-bottom:1px solid var(--line);
  margin-bottom:6px;
}
.search-box input{
  flex:1;
  min-width:0;
  padding:7px 10px;
  border:1px solid var(--line-strong);
  border-radius:4px;
  background:var(--paper);
  color:var(--ink);
  font-family:'Work Sans', sans-serif;
  font-size:13px;
}
.search-box .link-btn{flex-shrink:0; margin-left:0;}
.search-box input:focus-visible{outline:2px solid var(--amber); outline-offset:1px;}
.link-btn{
  background:none; border:none; padding:0; margin-left:8px;
  color:var(--amber-dark); text-decoration:underline; cursor:pointer; font-size:12.5px;
}
.login-screen{
  min-height:100vh;
  width:100%;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
}
.login-box{
  max-width:380px;
  width:100%;
  background:var(--panel-raised);
  border:1px solid var(--line-strong);
  border-radius:6px;
  padding:28px 26px;
}
nav{display:flex;flex-direction:column;gap:2px;padding:6px 10px;}
.nav-btn{
  display:flex;
  align-items:center;
  gap:10px;
  text-align:left;
  padding:10px 12px;
  border:none;
  background:transparent;
  border-radius:5px;
  cursor:pointer;
  font-size:14.5px;
  color:var(--ink);
  font-weight:500;
}
.nav-btn:hover{background:var(--panel-raised);}
.nav-btn.active{
  background:var(--ink);
  color:var(--paper);
}
.nav-count{
  margin-left:auto;
  font-size:12px;
  background:var(--amber);
  color:#fff;
  border-radius:10px;
  padding:1px 7px;
  min-width:18px;
  text-align:center;
}
.nav-btn.active .nav-count{background:var(--amber);}
.nav-btn:not(.active) .nav-count{background:var(--rust);}

/* Main */
main{
  flex:1;
  padding:32px 36px 60px 36px;
  max-width:760px;
}
.view-title{
  font-size:24px;
  margin:0 0 4px 0;
}
.view-sub{
  color:var(--ink-light);
  margin:0 0 24px 0;
  font-size:14px;
}

/* Ticket card */
.ticket{
  background:var(--panel-raised);
  border:1px solid var(--line-strong);
  border-radius:4px;
  position:relative;
  margin-bottom:18px;
  overflow:hidden;
}
.ticket::before{
  content:"";
  position:absolute;
  left:0; top:0; bottom:0;
  width:16px;
  background-image: radial-gradient(circle at 8px 22px, var(--paper) 4px, transparent 4.5px),
                     radial-gradient(circle at 8px 54px, var(--paper) 4px, transparent 4.5px),
                     radial-gradient(circle at 8px 86px, var(--paper) 4px, transparent 4.5px);
  background-repeat: repeat-y;
  background-size: 16px 96px;
  border-right:1px dashed var(--line-strong);
}
.ticket-inner{
  padding:18px 20px 20px 34px;
}
.ticket-head{
  display:flex;
  justify-content:space-between;
  align-items:flex-start;
  gap:10px;
  margin-bottom:12px;
  padding-bottom:12px;
  border-bottom:1px dashed var(--line-strong);
}
.ticket-num{
  font-family:'Oswald', sans-serif;
  font-size:13px;
  color:var(--ink-light);
}
.ticket-name{
  font-size:18px;
  font-weight:600;
  margin:2px 0 0 0;
  font-family:'Oswald', sans-serif;
}
.badge{
  font-size:12px;
  font-weight:600;
  padding:3px 10px;
  border-radius:20px;
  white-space:nowrap;
}
.badge-geplant{background:var(--slate-bg); color:var(--slate);}
.badge-in_bearbeitung{background:var(--rust-bg); color:var(--rust);}
.badge-fertig{background:var(--moss-bg); color:var(--moss);}

.ticket-meta{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:6px 18px;
  font-size:13.5px;
  color:var(--ink);
  margin-bottom:10px;
}
.ticket-meta div span{color:var(--ink-light);}
.ticket-anliegen{
  font-size:13.5px;
  margin-bottom:14px;
  color:var(--ink);
}
.ticket-actions{display:flex; gap:8px; flex-wrap:wrap;}

/* Forms */
.field{margin-bottom:14px;}
.field label{
  display:block;
  font-size:13px;
  color:var(--ink-light);
  margin-bottom:4px;
  font-weight:500;
}
.field input, .field textarea{
  width:100%;
  padding:9px 11px;
  border:1px solid var(--line-strong);
  border-radius:4px;
  background:var(--paper);
  color:var(--ink);
  font-family:'Work Sans', sans-serif;
  font-size:14px;
}
.field input:focus-visible, .field textarea:focus-visible, button:focus-visible{
  outline:2px solid var(--amber);
  outline-offset:1px;
}
.field textarea{min-height:70px; resize:vertical;}
.checkbox-field{margin-top:-4px;}
.checkbox-label{
  display:flex;
  align-items:center;
  gap:8px;
  font-size:14px;
  font-weight:400;
  color:var(--ink);
  cursor:pointer;
}
.checkbox-label input[type=checkbox]{width:16px; height:16px; margin:0;}
.row2{display:grid; grid-template-columns:1fr 1fr; gap:0 14px;}

.aufmass-card{
  border:1px solid var(--line-strong);
  border-radius:5px;
  background:var(--panel-raised);
  padding:14px 16px 16px 16px;
  margin-bottom:14px;
}
.aufmass-card-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:8px;
}
.aufmass-card-num{
  font-family:'Oswald', sans-serif;
  font-size:13px;
  color:var(--ink-light);
}
.btn-remove-row{
  background:none;
  border:none;
  color:var(--rust);
  cursor:pointer;
  font-size:15px;
  padding:4px;
}
.btn-remove-row:hover{color:#8f3a26;}

.toggle-group{
  display:flex;
  align-items:center;
  gap:8px;
  flex-wrap:wrap;
  margin-bottom:10px;
}
.toggle-label{
  font-size:13px;
  color:var(--ink-light);
  font-weight:500;
  min-width:66px;
}
.toggle-pill{
  border:1px solid var(--line-strong);
  background:var(--paper);
  color:var(--ink);
  padding:6px 14px;
  border-radius:20px;
  font-size:13.5px;
  font-weight:500;
  cursor:pointer;
}
.toggle-pill:hover{background:var(--panel);}
.toggle-pill.active{
  background:var(--amber);
  border-color:var(--amber);
  color:#fff;
}
.toggle-hint{
  font-size:13px;
  color:var(--ink-light);
  font-style:italic;
}

.time-range{
  display:flex;
  align-items:center;
  gap:10px;
  flex-wrap:wrap;
}
.time-range input[type=time]{
  width:auto;
  flex:0 0 auto;
}
.time-sep{color:var(--ink-light); font-size:13.5px;}
.dauer-anzeige{
  font-size:13.5px;
  color:var(--moss);
  font-weight:600;
  margin-left:4px;
}

.btn{
  border:none;
  padding:10px 18px;
  border-radius:5px;
  font-size:14px;
  font-weight:600;
  cursor:pointer;
}
.btn-primary{background:var(--amber); color:#fff;}
.btn-primary:hover{background:var(--amber-dark);}
.btn-ghost{background:transparent; border:1px solid var(--line-strong); color:var(--ink);}
.btn-ghost:hover{background:var(--panel);}
.btn-yes{background:var(--moss); color:#fff;}
.btn-yes:hover{background:#365f33;}
.btn-no{background:var(--rust); color:#fff;}
.btn-no:hover{background:#8f3a26;}
.btn-small{padding:6px 12px; font-size:13px;}

.empty{
  border:1px dashed var(--line-strong);
  border-radius:6px;
  padding:26px 20px;
  text-align:center;
  color:var(--ink-light);
  font-size:14px;
}

.question-box{
  background:var(--panel);
  border:1px solid var(--line-strong);
  border-radius:5px;
  padding:16px 18px;
  margin-top:16px;
}
.question-box p{margin:0 0 12px 0; font-weight:600; font-size:14.5px;}

.todo-row{
  display:flex;
  align-items:flex-start;
  gap:12px;
  padding:12px 4px;
  border-bottom:1px solid var(--line);
}
.todo-row:last-child{border-bottom:none;}
.todo-row input[type=checkbox]{margin-top:3px; width:16px; height:16px;}
.todo-text{font-size:14.5px;}
.todo-context{font-size:12.5px; color:var(--ink-light); margin-top:2px;}

.back-link{
  background:none; border:none; color:var(--ink-light); cursor:pointer;
  font-size:13px; margin-bottom:14px; padding:0; text-decoration:underline;
}

.saved-flag{
  font-size:12.5px; color:var(--moss); margin-left:10px;
}

@media (max-width: 720px){
  #app{flex-direction:column;}
  .sidebar{
    width:100%;
    padding:10px 0;
    border-right:none;
    border-bottom:1px solid var(--line-strong);
  }
  .brand{border-bottom:none; margin-bottom:6px; padding:0 16px 8px 16px;}
  nav{flex-direction:row; overflow-x:auto; padding:4px 10px 8px 10px; gap:4px; -webkit-overflow-scrolling:touch;}
  .nav-btn{white-space:nowrap; padding:12px 14px; font-size:14px;}
  main{padding:16px 14px 60px 14px;}
  .row2{grid-template-columns:1fr;}
  .ticket-meta{grid-template-columns:1fr;}
  .field input, .field select, .field textarea{ font-size:16px; padding:11px 12px; }
  .btn, .btn-small{ padding:12px 18px; font-size:15px; min-height:44px; }
  .btn-small{ padding:10px 14px; font-size:13.5px; min-height:40px; }
  .ticket-actions{ display:flex; flex-direction:column; gap:8px; }
  .ticket-actions .btn, .ticket-actions .btn-small{ width:100%; }
  .btn-remove-row{ min-width:32px; min-height:32px; }
  input[type="checkbox"]{ width:20px; height:20px; }
  h1.view-title{ font-size:22px; }
}
</style>

const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZyZmZma3VweWhldnhqamRkd2NrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg5NjI2NTcsImV4cCI6MjEwNDUzODY1N30.ZwDLr-hWKvmDvGIaNbRZF3xHP_nG5lRwsUWCTA_IbSA';
const APP_DATA_KEY = 'montage-auftraege-daten';

async function loadData(){
  try{
    const res = await fetch(`${SUPABASE_URL}/rest/v1/app_data?key=eq.${APP_DATA_KEY}&select=value`, {
      headers: {
        'apikey': SUPABASE_ANON_KEY,
        'Authorization': 'Bearer ' + SUPABASE_ANON_KEY
      }
    });
    if(!res.ok) throw new Error('Supabase-Antwort nicht ok: ' + res.status);
    const zeilen = await res.json();
    if(zeilen && zeilen.length > 0 && zeilen[0].value){
      DATA = zeilen[0].value;
      if(!DATA.orders) DATA.orders = [];
      if(typeof DATA.counter !== 'number') DATA.counter = DATA.orders.length;
    } else {
      DATA = { counter: 0, orders: [] };
    }

    console.error('Laden aus Supabase fehlgeschlagen', e);
    DATA = { counter: 0, orders: [] };
    loadError = true;
  }
  if(!DATA.mitarbeiterAufgaben) DATA.mitarbeiterAufgaben = {};

  if(!DATA.lagerbestand) DATA.lagerbestand = [];
  if(!DATA.kunden) DATA.kunden = [];
  if(!DATA.sollStundenProMonat) DATA.sollStundenProMonat = 160;
  DATA.mitarbeiterListe.forEach(m => { if(!DATA.mitarbeiterAufgaben[m]) DATA.mitarbeiterAufgaben[m] = []; });
  loading = false;
  render();
}

async function saveData(){

    });

    } else {
      loadError = false;
    }

const ANREDE_OPTIONEN = ['Herr', 'Frau', 'Familie', 'Firma'];

function anzeigeName(o){
  return (o.anrede ? o.anrede + ' ' : '') + (o.name || '');
}

function auftragsNummer(o){
  return (o.nurAufmass ? 'M-' : 'A-') + o.num;
}

function esc(str){
  if(str === undefined || str === null) return '';
  return String(str).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function gcalZeitformat(d){
  const p = n => String(n).padStart(2,'0');
  return d.getFullYear() + p(d.getMonth()+1) + p(d.getDate()) + 'T' + p(d.getHours()) + p(d.getMinutes()) + '00';
}

function baueDriveSucheUrl(suchbegriff){
  return 'https://drive.google.com/drive/search?q=' + encodeURIComponent(suchbegriff);
}

function oeffneDriveSucheName(orderId){
  const o = DATA.orders.find(x => x.id === orderId);
  if(!o) return;
  window.open(baueDriveSucheUrl(o.name), '_blank');
}

function oeffneDriveSucheNummer(orderId){
  const o = DATA.orders.find(x => x.id === orderId);
  if(!o) return;
  window.open(baueDriveSucheUrl(auftragsNummer(o)), '_blank');
}

function baueGoogleCalendarUrl(titel, montageterminWert, ort, strasse, details){
  let datesParam = '';
  if(montageterminWert){
    const start = new Date(montageterminWert);
    if(!isNaN(start.getTime())){
      const end = new Date(start.getTime() + 2*60*60*1000); // Standard: 2 Stunden
      datesParam = '&dates=' + gcalZeitformat(start) + '/' + gcalZeitformat(end);
    }
  }
  const params = new URLSearchParams();
  params.set('action', 'TEMPLATE');
  params.set('text', titel);
  if(details) params.set('details', details);
  if(ort || strasse) params.set('location', [strasse, ort].filter(Boolean).join(', '));
  return 'https://calendar.google.com/calendar/render?' + params.toString() + datesParam;
}

function baueWochenansichtUrl(montageterminWert){
  const d = montageterminWert ? new Date(montageterminWert) : new Date();
  const basis = isNaN(d.getTime()) ? new Date() : d;
  return 'https://calendar.google.com/calendar/r/week/' + basis.getFullYear() + '/' + (basis.getMonth()+1) + '/' + basis.getDate();
}

function oeffneWochenansichtNeu(){
  const f = document.getElementById('new-order-form');
  window.open(baueWochenansichtUrl(f.montagetermin.value), '_blank');
}

function oeffneAuftragWochenansicht(orderId){
  const o = DATA.orders.find(x => x.id === orderId);
  if(!o) return;
  window.open(baueWochenansichtUrl(o.montagetermin), '_blank');
}

function oeffneNeuenTerminInGCal(){
  const f = document.getElementById('new-order-form');
  const name = f.name.value.trim() || 'Montagetermin';
  const plz = f.plz.value.trim();
  const ort = f.ort.value.trim();
  const strasse = f.strasse.value.trim();
  const telefon = f.telefon.value.trim();
  const anliegen = f.anliegen.value.trim();
  const details = [telefon ? 'Telefon: ' + telefon : '', anliegen].filter(Boolean).join('\n');
  const url = baueGoogleCalendarUrl(name, f.montagetermin.value, [plz, ort].filter(Boolean).join(' '), strasse, details);

function fmtDateTime(v){

  const d = new Date(v);
  if(isNaN(d.getTime())) return esc(v);

}

function dauerText(von, bis){
  if(!von || !bis) return '';
  const [vh, vm] = von.split(':').map(Number);
  const [bh, bm] = bis.split(':').map(Number);
  let minutes = (bh*60+bm) - (vh*60+vm);
  if(minutes < 0) minutes += 24*60; // Arbeit über Mitternacht
  const h = Math.floor(minutes/60);
  const m = minutes % 60;
  return `= ${h} Std ${m > 0 ? m + ' Min' : ''}`.trim();
}

function parseCsvLine(line, delimiter){
  const result = [];
  let cur = '';
  let inQuotes = false;
  for(let i = 0; i < line.length; i++){
    const c = line[i];
    if(inQuotes){
      if(c === '"'){
        if(line[i+1] === '"'){ cur += '"'; i++; }
        else inQuotes = false;
      } else cur += c;
    } else {
      if(c === '"') inQuotes = true;
      else if(c === delimiter){ result.push(cur); cur = ''; }
      else cur += c;
    }
  }
  result.push(cur);
  return result;
}

function findeSpalte(header, moeglicheNamen){
  const idx = header.findIndex(h => moeglicheNamen.includes(h.trim().toLowerCase()));
  return idx;
}

function parseKundenCsv(text){
  const zeilen = text.split(/\r?\n/).filter(z => z.trim().length > 0);
  if(zeilen.length < 2) return [];
  const header = parseCsvLine(zeilen[0], ';').map(h => h.trim());
  const headerLower = header.map(h => h.toLowerCase());
  const idxAnrede = findeSpalte(headerLower, ['anrede']);
  const idxName = findeSpalte(headerLower, ['name']);
  const idxVorname = findeSpalte(headerLower, ['vorname']);
  const idxFirma = findeSpalte(headerLower, ['firma']);
  const idxZusatz = findeSpalte(headerLower, ['zusatz']);
  const idxStrasse = findeSpalte(headerLower, ['straße', 'strasse']);
  const idxPlz = findeSpalte(headerLower, ['postleitzahl', 'plz']);
  const idxOrt = findeSpalte(headerLower, ['ort']);
  const idxEmail = findeSpalte(headerLower, ['email', 'e-mail']);

  const kunden = [];
  for(let i = 1; i < zeilen.length; i++){
    const felder = parseCsvLine(zeilen[i], ';');
    const get = idx => idx >= 0 && felder[idx] !== undefined ? felder[idx].trim() : '';
    const firma = get(idxFirma);
    const anrede = get(idxAnrede);
    const vorname = get(idxVorname);
    const name = get(idxName);
    const strasse = get(idxStrasse);
    const ort = get(idxOrt);
    const anzeigename = firma || [anrede, vorname, name].filter(Boolean).join(' ');
    if(!anzeigename && !strasse && !ort) continue;
    kunden.push({
      id: 'kunde_' + Date.now() + '_' + Math.random().toString(36).slice(2,8),
      name: anzeigename,
      firma: firma,
      zusatz: get(idxZusatz),
      strasse: strasse,
      plz: get(idxPlz),
      ort: ort,
      email: get(idxEmail)
    });
  }
  return kunden;
}

async function handleKundenUpload(inputEl){
  const datei = inputEl.files && inputEl.files[0];
  inputEl.value = '';
  if(!datei) return;
  const text = await datei.text();
  let neueKunden = [];
  try{
    const geparsed = JSON.parse(text);
    if(Array.isArray(geparsed)){
      neueKunden = geparsed.map(k => ({
        id: k.id || ('kunde_' + Date.now() + '_' + Math.random().toString(36).slice(2,8)),
        name: k.name || '',
        firma: k.firma || '',
        zusatz: k.zusatz || '',
        strasse: k.strasse || '',
        plz: k.plz || '',
        ort: k.ort || '',
        email: k.email || ''
      }));
    }
  }catch(e){
    neueKunden = parseKundenCsv(text);
  }

  const bestehendeSchluessel = new Set(DATA.kunden.map(k => (k.name + '|' + k.strasse + '|' + k.plz).toLowerCase()));
  let hinzugefuegt = 0;
  neueKunden.forEach(k => {
    const schluessel = (k.name + '|' + k.strasse + '|' + k.plz).toLowerCase();
    if(!bestehendeSchluessel.has(schluessel)){
      DATA.kunden.push(k);
      bestehendeSchluessel.add(schluessel);
      hinzugefuegt++;
    }
  });

  await saveData();
  alert(hinzugefuegt + ' neue Kunden importiert (' + (neueKunden.length - hinzugefuegt) + ' Dubletten übersprungen).');
  render();
}

async function submitBearbeiteAuftrag(ev, orderId){
  ev.preventDefault();
  const f = ev.target;
  const errBox = document.getElementById('edit-order-error');
  const order = DATA.orders.find(o => o.id === orderId);
  if(!order) return;

  const anrede = f.anrede.value;
  const name = f.name.value.trim();
  const plz = f.plz.value.trim();
  const ort = f.ort.value.trim();
  const strasse = f.strasse.value.trim();
  const email = f.email.value.trim();
  const telefon = f.telefon.value.trim();
  const anliegen = f.anliegen.value.trim();
  const montagetermin = f.montagetermin.value;

  const missing = [];
  if(!anrede) missing.push('Anrede');
  if(!name) missing.push('Name');
  if(!plz) missing.push('Postleitzahl');
  if(!ort) missing.push('Ort');
  if(!strasse) missing.push('Straße & Hausnummer');
  else if(!/\d/.test(strasse)) missing.push('Hausnummer (bitte in "Straße & Hausnummer" mit angeben)');
  if(!email) missing.push('E-Mail');
  if(!telefon) missing.push('Telefon');
  if(!anliegen) missing.push('Worum geht es?');
  if(!montagetermin) missing.push('Termin');

  if(missing.length > 0){
    errBox.textContent = 'Bitte ausfüllen: ' + missing.join(', ') + '.';
    errBox.style.display = 'block';
    return;
  }
  errBox.style.display = 'none';

  order.anrede = anrede;
  order.name = name;
  order.plz = plz;
  order.ort = ort;
  order.strasse = strasse;
  order.email = email;
  order.telefon = telefon;
  order.anliegen = anliegen;
  order.montagetermin = montagetermin;
  const neuMitarbeiter1 = f.edit_mitarbeiter1.value;
  const neuMitarbeiter2 = f.edit_mitarbeiter2.value;
  order.zustaendig = [neuMitarbeiter1, neuMitarbeiter2].filter(Boolean).join(' & ') || null;
  order.aufmassBenoetigt = document.getElementById('edit_aufmass_rollladen').checked;
  order.aufmassMarkiseBenoetigt = document.getElementById('edit_aufmass_markise').checked;
  order.aufmassTuchwechselBenoetigt = document.getElementById('edit_aufmass_tuchwechsel').checked;
  await saveData();
  schliesseBearbeiten();
}

function istCanvasLeer(canvas){
  const ctx = canvas.getContext('2d');
  const pixel = ctx.getImageData(0, 0, canvas.width, canvas.height).data;
  for(let i = 3; i < pixel.length; i += 4){
    if(pixel[i] !== 0) return false;
  }
  return true;
}

function unterschriftLoeschen(){
  const canvas = document.getElementById('signature-canvas');
  if(!canvas) return;
  canvas.getContext('2d').clearRect(0, 0, canvas.width, canvas.height);
}

function initSignaturePad(){
  const canvas = document.getElementById('signature-canvas');
  if(!canvas || canvas.dataset.init) return;
  canvas.dataset.init = '1';
  const ctx = canvas.getContext('2d');
  ctx.strokeStyle = '#2B2620';
  ctx.lineWidth = 2;
  ctx.lineCap = 'round';
  let zeichnet = false;
  function pos(e){
    const rect = canvas.getBoundingClientRect();
    const scaleX = canvas.width / rect.width;
    const scaleY = canvas.height / rect.height;
    const clientX = e.touches ? e.touches[0].clientX : e.clientX;
    const clientY = e.touches ? e.touches[0].clientY : e.clientY;
    return { x: (clientX - rect.left) * scaleX, y: (clientY - rect.top) * scaleY };
  }
  function start(e){ zeichnet = true; const p = pos(e); ctx.beginPath(); ctx.moveTo(p.x, p.y); e.preventDefault(); }
  function move(e){ if(!zeichnet) return; const p = pos(e); ctx.lineTo(p.x, p.y); ctx.stroke(); e.preventDefault(); }
  function end(){ zeichnet = false; }
  canvas.addEventListener('mousedown', start);
  canvas.addEventListener('mousemove', move);
  window.addEventListener('mouseup', end);
  canvas.addEventListener('touchstart', start, { passive: false });
  canvas.addEventListener('touchmove', move, { passive: false });
  canvas.addEventListener('touchend', end);
}

function baueSuchHaystack(o){
  const teile = ['a-' + o.num, String(o.num), o.name, o.plz, o.ort, o.strasse, o.telefon, o.email, o.anliegen];
  if(o.aufmass){
    teile.push(o.aufmass.notiz, o.aufmass.geschaetzterAufwand, o.aufmass.besondereTaetigkeiten);
    (o.aufmass.positionen||[]).forEach(p => teile.push(p.bezeichnung, p.bemerkung, p.farbe));
  }
  if(o.aufmassMarkise){
    teile.push(o.aufmassMarkise.notiz);
    (o.aufmassMarkise.positionen||[]).forEach(p => teile.push(p.markisentyp, p.dessin, p.sonstiges, p.bemerkung));
  }
  if(o.aufmassTuchwechsel){
    teile.push(o.aufmassTuchwechsel.notiz);
    (o.aufmassTuchwechsel.positionen||[]).forEach(p => teile.push(p.stoffnummer, p.bemerkung));
  }
  if(o.report) teile.push(o.report.notizen, o.report.material);
  (o.montageHistorie||[]).forEach(e => teile.push(e.notizen, e.material));
  (o.bestellungen||[]).forEach(b => teile.push(b.text));
  (o.angebote||[]).forEach(a => teile.push(a.text));
  return teile.filter(Boolean).join(' ').toLowerCase();
}

function sucheAuftraege(query){
  const q = query.trim().toLowerCase();
  if(!q) return [];
  return DATA.orders.filter(o => baueSuchHaystack(o).includes(q))
    .sort((a,b) => (b.montagetermin||'').localeCompare(a.montagetermin||''));
}

function sucheMitarbeiterAufgaben(query){
  const q = query.trim().toLowerCase();
  if(!q) return [];
  const treffer = [];
  DATA.mitarbeiterListe.forEach(m => {
    (DATA.mitarbeiterAufgaben[m] || []).forEach(a => {
      if((a.text + ' ' + (a.notiz||'')).toLowerCase().includes(q)) treffer.push({ mitarbeiter: m, aufgabe: a });
    });
  });
  return treffer;
}

function druckeWochenplan(){
  const heute = new Date();
  const wochentag = (heute.getDay() + 6) % 7; // 0 = Montag
  const montag = new Date(heute);
  montag.setDate(heute.getDate() - wochentag);
  montag.setHours(0,0,0,0);
  const tage = [];
  for(let i = 0; i < 7; i++){
    const d = new Date(montag);
    d.setDate(montag.getDate() + i);
    tage.push(d);
  }
  const tageNamen = ['Montag','Dienstag','Mittwoch','Donnerstag','Freitag','Samstag','Sonntag'];

  const win = window.open('', '_blank');
  if(!win) return;

  let tabelle = '<table style="width:100%; border-collapse:collapse;"><tr><th style="border:1px solid #ccc; padding:6px; background:#f0ece0; text-align:left;">Mitarbeiter</th>';
  tage.forEach((d,i) => {
    tabelle += `<th style="border:1px solid #ccc; padding:6px; background:#f0ece0; text-align:left;">${tageNamen[i]}<br>${d.toLocaleDateString('de-DE')}</th>`;
  });
  tabelle += '</tr>';

  DATA.mitarbeiterListe.forEach(m => {
    tabelle += `<tr><td style="border:1px solid #ccc; padding:6px; font-weight:bold; vertical-align:top;">${esc(m)}</td>`;
    tage.forEach(d => {
      const tagEnde = new Date(d); tagEnde.setHours(23,59,59,999);
      const termine = DATA.orders
        .filter(o => o.zustaendig && o.zustaendig.split(' & ').includes(m) && o.status !== 'fertig' && o.montagetermin && new Date(o.montagetermin) >= d && new Date(o.montagetermin) <= tagEnde)
        .sort((a,b) => a.montagetermin.localeCompare(b.montagetermin));
      const inhalt = termine.map(o => {
        const zeit = new Date(o.montagetermin).toLocaleTimeString('de-DE', {hour:'2-digit', minute:'2-digit'});
        return zeit + ' ' + esc(anzeigeName(o));
      }).join('<br>');
      tabelle += `<td style="border:1px solid #ccc; padding:6px; vertical-align:top; font-size:12px;">${inhalt}</td>`;
    });
    tabelle += '</tr>';
  });
  tabelle += '</table>';

  win.document.write(`<!DOCTYPE html><html><head><title>Wochenplan</title>
    <meta charset="utf-8">
    <style>body{font-family:Arial,sans-serif; padding:24px; color:#222;} h1{margin-bottom:4px;} table{margin-top:16px;}</style>
    </head><body>
    <h1>Wochenplan</h1>
    <p>${tage[0].toLocaleDateString('de-DE')} – ${tage[6].toLocaleDateString('de-DE')}</p>
    ${tabelle}
    </body></html>`);
  win.document.close();
  win.focus();
  setTimeout(() => win.print(), 300);
}

function renderMeinTagInhalt(){
  const meineAuftraege = DATA.orders
    .filter(o => o.status !== 'fertig' && o.zustaendig && o.zustaendig.split(' & ').includes(currentUser))
    .sort((a,b) => (a.montagetermin||'').localeCompare(b.montagetermin||''));

  if(meineAuftraege.length === 0){
    return `<div class="empty">Aktuell sind dir keine Termine zugewiesen.</div>`;
  }

  const heute = new Date(); heute.setHours(0,0,0,0);
  const morgen = new Date(heute); morgen.setDate(morgen.getDate() + 1);
  const uebermorgen = new Date(heute); uebermorgen.setDate(uebermorgen.getDate() + 2);
  const wocheEnde = new Date(heute); wocheEnde.setDate(wocheEnde.getDate() + (7 - heute.getDay()));

  function gruppenName(o){
    if(!o.montagetermin) return 'Ohne Termin';
    const d = new Date(o.montagetermin);
    if(d >= heute && d < morgen) return 'Heute';
    if(d >= morgen && d < uebermorgen) return 'Morgen';
    if(d < wocheEnde) return 'Diese Woche';
    return 'Später';
  }

  const gruppen = {'Heute': [], 'Morgen': [], 'Diese Woche': [], 'Später': [], 'Ohne Termin': []};
  meineAuftraege.forEach(o => gruppen[gruppenName(o)].push(o));

  return `
    ${Object.entries(gruppen).filter(([,list]) => list.length > 0).map(([label, list]) => `
      <h3 style="font-size:14.5px; margin:16px 0 8px 0; color:var(--ink-light);">${label} (${list.length})</h3>

            <div><span>Termin: </span>${fmtDateTime(o.montagetermin)}</div>
          </div>
          <div class="ticket-actions">
            ${o.aufmassBenoetigt && !o.aufmass ? `<button class="btn btn-primary btn-small" onclick="setView('aufmass'); openAufmass('${o.id}');">Aufmaß Rollladen öffnen</button>` : ''}

function berechneMaterialForecast(){
  const wartend = DATA.orders.filter(o => o.materialStatus === 'wartet');
  const heute = new Date(); heute.setHours(0,0,0,0);
  const wochentag = (heute.getDay() + 6) % 7;
  const montag = new Date(heute); montag.setDate(heute.getDate() - wochentag);

  const wochenLabels = ['Diese Woche', 'Nächste Woche', 'In 2 Wochen', 'In 3 Wochen'];
  const buckets = [[], [], [], []];
  const spaeter = [];
  const ohneDatum = [];
  const ueberfaellig = [];

  wartend.forEach(o => {
    if(!o.erwartetesWareneingangsdatum){ ohneDatum.push(o); return; }
    const d = new Date(o.erwartetesWareneingangsdatum);
    const diffTage = Math.floor((d - montag) / (1000*60*60*24));
    const wocheIndex = Math.floor(diffTage / 7);
    if(wocheIndex < 0) ueberfaellig.push(o);
    else if(wocheIndex < 4) buckets[wocheIndex].push(o);
    else spaeter.push(o);
  });

  return { wochenLabels, buckets, spaeter, ohneDatum, ueberfaellig };
}

function renderMonatskalender(){
  const heute = new Date();
  const jahr = heute.getFullYear();
  const monat = heute.getMonth();
  const ersterTag = new Date(jahr, monat, 1);
  const letzterTag = new Date(jahr, monat + 1, 0);
  const startOffset = (ersterTag.getDay() + 6) % 7;
  const tageImMonat = letzterTag.getDate();
  const monatsName = heute.toLocaleDateString('de-DE', {month: 'long', year: 'numeric'});

  const terminePerTag = {};
  DATA.orders.forEach(o => {
    if(!o.montagetermin || o.status === 'fertig' || !o.zustaendig) return;
    const d = new Date(o.montagetermin);
    if(d.getFullYear() === jahr && d.getMonth() === monat){
      const tag = d.getDate();
      if(!terminePerTag[tag]) terminePerTag[tag] = [];
      terminePerTag[tag].push(o);
    }
  });

  let zellen = '';
  for(let i = 0; i < startOffset; i++) zellen += `<div></div>`;
  for(let tag = 1; tag <= tageImMonat; tag++){
    const istHeute = tag === heute.getDate();
    const termine = (terminePerTag[tag] || []).sort((a,b) => a.montagetermin.localeCompare(b.montagetermin));
    zellen += `
      <div style="background:${istHeute ? 'var(--panel-raised)' : 'var(--paper)'}; border:${istHeute ? '2px solid var(--amber)' : '1px solid var(--line)'}; border-radius:4px; padding:5px; min-height:64px;">
        <div style="font-size:11.5px; font-weight:600; color:${istHeute ? 'var(--amber-dark)' : 'var(--ink-light)'}; margin-bottom:3px;">${tag}</div>
        ${termine.slice(0, 3).map(o => `<div style="font-size:10px; color:var(--ink); margin-bottom:1px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;" title="${esc(anzeigeName(o))}">${new Date(o.montagetermin).toLocaleTimeString('de-DE', {hour:'2-digit', minute:'2-digit'})} ${esc(anzeigeName(o))}</div>`).join('')}
        ${termine.length > 3 ? `<div style="font-size:9.5px; color:var(--ink-light);">+${termine.length - 3} weitere</div>` : ''}
      </div>
    `;
  }

  return `
    <p style="font-weight:600; margin:0 0 8px 0; font-size:14px;">${monatsName}</p>
    <div style="display:grid; grid-template-columns:repeat(7, 1fr); gap:4px; font-size:11px; margin-bottom:4px; color:var(--ink-light); text-align:center;">
      <div>Mo</div><div>Di</div><div>Mi</div><div>Do</div><div>Fr</div><div>Sa</div><div>So</div>
    </div>
    <div style="display:grid; grid-template-columns:repeat(7, 1fr); gap:4px;">
      ${zellen}
    </div>
  `;
}

function viewDashboard(){
  const poolCount = openAuftragspool().length;
  const montageCount = DATA.orders.filter(o => o.status !== 'fertig' && !o.nurAufmass && o.zustaendig && !hatOffeneAufmasse(o) && !(!o.montagetermin && !o.terminBestaetigt) && !(o.angebote||[]).some(a => !a.done)).length;
  const angebotCount = openAngebote().length;
  const angebotWartenListe = openAngebotWarten();
  const angebotWartenCount = angebotWartenListe.length;
  const angebotHaengendCount = angebotWartenListe.filter(o => o.angebotWartetSeit && o.angebotStatus === 'wartet_auf_rueckmeldung' && Math.floor((Date.now() - new Date(o.angebotWartetSeit).getTime()) / (1000*60*60*24)) >= 7).length;
  const bestellungCount = openBestellungen().length;
  const wartenCount = openWarten().length;
  const bereitCount = openBereitZurTerminierung().length;
  const aufgabenCount = openMitarbeiterAufgaben();
  let ueberfaelligeAufgabenCount = 0;
  DATA.mitarbeiterListe.forEach(m => {
    (DATA.mitarbeiterAufgaben[m] || []).forEach(a => {
      if(a.faelligAm && !a.done && new Date(a.faelligAm) < new Date(new Date().toDateString())) ueberfaelligeAufgabenCount++;
    });
  });

  const stat = (label, value, farbe) => `
    <div class="aufmass-card" style="text-align:center; padding:16px; margin-bottom:0;">
      <div style="font-size:28px; font-weight:700; color:${farbe || 'var(--ink)'};">${value}</div>
      <div style="font-size:12.5px; color:var(--ink-light); margin-top:4px;">${label}</div>
    </div>
  `;

  return `
    <h1 class="view-title">Übersicht</h1>
    <p class="view-sub">Alles Wichtige auf einen Blick.</p>

    <div style="display:grid; grid-template-columns:repeat(auto-fit, minmax(140px, 1fr)); gap:12px; margin-bottom:24px;">
      ${stat('Im Auftragspool', poolCount, '#4A7A8C')}
      ${stat('In Montage', montageCount, '#3E6C8C')}
      ${stat('Angebote zu erstellen', angebotCount, '#B8860B')}
      ${stat('Warten auf Kunde', angebotWartenCount, angebotHaengendCount > 0 ? 'var(--rust)' : 'var(--ink)')}
      ${stat('Bestellungen offen', bestellungCount, 'var(--rust)')}
      ${stat('Warten auf Material', wartenCount, '#B0567A')}
      ${stat('Bereit zu terminieren', bereitCount, '#3E7CB1')}
      ${stat('Mitarbeiter-Aufgaben', aufgabenCount, '#5B5FA8')}
    </div>

    ${angebotHaengendCount > 0 ? `
      <div class="question-box" style="border-color:var(--rust); margin-bottom:24px;">
        <p style="margin:0;"><strong>${angebotHaengendCount} Angebot${angebotHaengendCount === 1 ? '' : 'e'}</strong> ${angebotHaengendCount === 1 ? 'wartet' : 'warten'} schon 7+ Tage auf eine Kundenrückmeldung. <a href="#" onclick="event.preventDefault(); setView('angebotWarten');">Jetzt ansehen →</a></p>
      </div>
    ` : ''}

    ${ueberfaelligeAufgabenCount > 0 ? `
      <div class="question-box" style="border-color:var(--rust); margin-bottom:24px;">
        <p style="margin:0;"><strong>${ueberfaelligeAufgabenCount} Mitarbeiter-Aufgabe${ueberfaelligeAufgabenCount === 1 ? '' : 'n'}</strong> ${ueberfaelligeAufgabenCount === 1 ? 'ist' : 'sind'} überfällig. <a href="#" onclick="event.preventDefault(); setView('mitarbeiterAufgaben');">Jetzt ansehen →</a></p>
      </div>
    ` : ''}

    <h2 style="font-size:17px; margin:0 0 10px 0;">Mein Tag – ${esc(currentUser)}</h2>
    <div style="margin-bottom:24px;">
      ${renderMeinTagInhalt()}
    </div>

    <h2 style="font-size:17px; margin:0 0 10px 0;">Mitarbeiter-Auslastung</h2>
    <p style="font-size:12.5px; color:var(--ink-light); margin:0 0 10px 0;">Zeigt tatsächlich abgeschlossene Montagen (aus dem Montagebericht) – nicht nur die geplante Zuordnung, die sich ja noch ändern kann.</p>
    <div class="ticket" style="margin-bottom:24px;">
      <div class="ticket-inner">
        <div style="display:flex; align-items:center; gap:8px; margin-bottom:12px; font-size:13px; color:var(--ink-light);">
          <label for="soll-stunden-input">Soll-Stunden pro Monat:</label>
          <input id="soll-stunden-input" type="number" min="1" value="${DATA.sollStundenProMonat}" onchange="setzeSollStunden(this.value)" style="width:70px; padding:5px 8px; border:1px solid var(--line-strong); border-radius:4px; background:var(--paper); color:var(--ink); font-family:'Work Sans', sans-serif; font-size:13px;">
        </div>
        ${DATA.mitarbeiterListe.map(m => {
          const anzahl = DATA.orders.filter(o => o.status === 'fertig' && (o.montageHistorie || []).some(h => h.mitarbeiter === m)).length;
          const minutenMonat = minutenDiesenMonat(m);
          const stundenMonat = minutenMonat / 60;
          const prozent = Math.round((stundenMonat / DATA.sollStundenProMonat) * 100);
          return `
            <div style="padding:8px 0; border-bottom:1px solid var(--line);">
              <div style="display:flex; justify-content:space-between; align-items:center; font-size:14px;">
                <span>${esc(m)}</span>
                <div style="display:flex; align-items:center; gap:10px;">
                  <span style="font-weight:600;">${anzahl} abgeschlossene${anzahl === 1 ? ' Montage' : ' Montagen'}</span>
                  <button class="btn-remove-row" title="Mitarbeiter entfernen" onclick="mitarbeiterEntfernen('${esc(m)}')">✕</button>
                </div>
              </div>
              <div style="font-size:12.5px; color:var(--ink-light); margin-top:3px;">${formatMinuten(minutenMonat)} diesen Monat · <strong style="color:${prozent >= 80 ? 'var(--moss)' : prozent >= 50 ? 'var(--ink)' : 'var(--rust)'};">${prozent}% von ${DATA.sollStundenProMonat} Std produktiv</strong></div>
            </div>
          `;
        }).join('')}
        <div style="display:flex; gap:6px; margin-top:12px;">
          <input id="neuer-mitarbeiter-input" placeholder="Neuer Mitarbeiter …" style="flex:1; padding:7px 9px; border:1px solid var(--line-strong); border-radius:4px; background:var(--paper); color:var(--ink); font-family:'Work Sans', sans-serif; font-size:13.5px;" onkeydown="if(event.key==='Enter'){event.preventDefault(); mitarbeiterHinzufuegen();}">
          <button class="btn btn-primary btn-small" onclick="mitarbeiterHinzufuegen()">+ Hinzufügen</button>
        </div>
      </div>
    </div>

    <h2 style="font-size:17px; margin:0 0 10px 0;">Material-Forecast (nächste Wochen)</h2>
    <div class="ticket" style="margin-bottom:24px;">
      <div class="ticket-inner">
        ${(() => {
          const forecast = berechneMaterialForecast();
          const maxCount = Math.max(1, ...forecast.buckets.map(b => b.length), forecast.spaeter.length, forecast.ueberfaellig.length);
          if(forecast.ueberfaellig.length === 0 && forecast.buckets.every(b => b.length === 0) && forecast.spaeter.length === 0 && forecast.ohneDatum.length === 0){
            return `<p style="font-size:13px; color:var(--ink-light); margin:0;">Aktuell wartet nichts auf Material.</p>`;
          }
          return `
            ${forecast.ueberfaellig.length > 0 ? renderForecastBalken('Überfällig', forecast.ueberfaellig, maxCount, 'var(--rust)') : ''}
            ${forecast.wochenLabels.map((label, i) => renderForecastBalken(label, forecast.buckets[i], maxCount, '#3E7CB1')).join('')}
            ${forecast.spaeter.length > 0 ? renderForecastBalken('Später', forecast.spaeter, maxCount, 'var(--ink-light)') : ''}
            ${forecast.ohneDatum.length > 0 ? `<p style="font-size:12.5px; color:var(--ink-light); margin-top:6px;">${forecast.ohneDatum.length} Auftrag${forecast.ohneDatum.length === 1 ? '' : 'e'} ohne hinterlegtes Wareneingangsdatum. <a href="#" onclick="event.preventDefault(); setView('warten');">Jetzt ergänzen →</a></p>` : ''}
          `;
        })()}
      </div>
    </div>

    <h2 style="font-size:17px; margin:0 0 10px 0;">Monatsübersicht</h2>
    <div class="ticket" style="margin-bottom:24px;">
      <div class="ticket-inner">
        ${renderMonatskalender()}
      </div>
    </div>

    <h2 style="font-size:17px; margin:0 0 10px 0;">Wochenplan</h2>
    <div class="ticket" style="margin-bottom:24px;">
      <div class="ticket-inner">
        <p style="margin:0 0 10px 0; font-size:13.5px; color:var(--ink-light);">Druckansicht "Wer macht was diese Woche" – für Büro oder Werkstattwand.</p>
        <button class="btn btn-primary btn-small" onclick="druckeWochenplan()">Wochenplan drucken</button>
      </div>
    </div>

    <h2 style="font-size:17px; margin:0 0 10px 0;">Datensicherung</h2>
    <div class="ticket">
      <div class="ticket-inner">
        <p style="margin:0 0 10px 0; font-size:13.5px; color:var(--ink-light);">Lädt eine vollständige Sicherungskopie aller Aufträge, Aufmaße und Aufgaben als Datei herunter.</p>
        <button class="btn btn-primary btn-small" onclick="exportDaten()">Daten exportieren (Backup)</button>
      </div>
    </div>
  `;
}

function viewAngebotDokument(order){
  if(!order || !angebotDokumentDraft) return `<div class="empty">Auftrag nicht gefunden.</div>`;

  return `
    <button class="back-link" onclick="schliesseAngebotDokument()">← Zurück</button>
    <h1 class="view-title">Angebot als Dokument · ${esc(order.name)}</h1>
    <p class="view-sub">Auftrag Nr. ${auftragsNummer(order)}</p>

    <div class="aufmass-card">
      <div class="aufmass-head-row" style="grid-template-columns:1fr 140px 32px;">
        <span>Position</span>
        <span>Preis (€)</span>
        <span></span>
      </div>
      ${angebotDokumentDraft.positionen.map(pos => `
        <div class="aufmass-row" style="grid-template-columns:1fr 140px 32px;">
          <input id="ap-bez-${pos.id}" value="${esc(pos.bezeichnung)}" placeholder="Positionsbezeichnung">
          <input id="ap-preis-${pos.id}" value="${esc(pos.preis)}" placeholder="0,00" inputmode="decimal" oninput="berechneAngebotSummeAnzeige()">
          <button class="btn-remove-row" title="Position entfernen" onclick="removeAngebotPosition('${pos.id}')">✕</button>
        </div>
      `).join('')}
    </div>
    <button class="btn btn-ghost btn-small" style="margin:10px 0 20px 0;" onclick="addAngebotPosition()">+ Position hinzufügen</button>

    <div class="ticket" style="margin-bottom:20px;">
      <div class="ticket-inner" style="display:flex; justify-content:space-between; align-items:center;">
        <span style="font-weight:600;">Gesamtsumme</span>
        <span id="angebot-summe-anzeige" style="font-size:20px; font-weight:700; color:var(--amber-dark);">${angebotSumme(angebotDokumentDraft.positionen).toLocaleString('de-DE', {minimumFractionDigits:2, maximumFractionDigits:2})} €</span>
      </div>
    </div>

    <div class="ticket-actions">
      <button class="btn btn-ghost" onclick="speichereAngebotDokument('${order.id}')">Speichern</button>
      <button class="btn btn-primary" onclick="angebotDokumentDruckenUndSpeichern('${order.id}')">Speichern & Drucken</button>
    </div>
  `;
}

function viewAuftragBearbeiten(order){
  if(!order) return `<div class="empty">Auftrag nicht gefunden.</div>`;

  if(pendingLoeschenOrderId === order.id){
    return `
      <button class="back-link" onclick="schliesseBearbeiten()">← Zurück</button>
      <h1 class="view-title">Auftrag wirklich löschen?</h1>
      <p class="view-sub">Auftrag Nr. ${auftragsNummer(order)} · ${esc(order.name)}</p>
      <div class="question-box">
        <p>Das kann nicht rückgängig gemacht werden. Alle Aufmaß-, Berichts- und Bestelldaten zu diesem Auftrag gehen verloren.</p>
        <div class="ticket-actions">
          <button class="btn btn-no" onclick="loescheAuftragEndgueltig('${order.id}')">Ja, endgültig löschen</button>
          <button class="btn btn-ghost" onclick="pendingLoeschenOrderId = null; render();">Abbrechen</button>
        </div>
      </div>
    `;
  }

  return `
    <button class="back-link" onclick="schliesseBearbeiten()">← Zurück</button>
    <h1 class="view-title">Auftrag bearbeiten</h1>
    <p class="view-sub">Auftrag Nr. ${auftragsNummer(order)}</p>
    <form id="edit-order-form" novalidate>
      <div id="edit-order-error" style="display:none; background:var(--rust-bg); color:var(--rust); border-radius:5px; padding:10px 14px; font-size:13.5px; margin-bottom:14px;"></div>
      <div class="row2">
        <div class="field">
          <label for="anrede">Anrede *</label>
          <select id="anrede" name="anrede">
            <option value="">— bitte wählen —</option>
            ${ANREDE_OPTIONEN.map(a => `<option value="${a}" ${order.anrede === a ? 'selected' : ''}>${a}</option>`).join('')}
          </select>
        </div>
        <div class="field">
          <label for="name">Name *</label>
          <input id="name" name="name" value="${esc(order.name)}">
        </div>
      </div>
      <div class="field">
        <label for="strasse">Straße & Hausnummer *</label>
        <input id="strasse" name="strasse" value="${esc(order.strasse)}">
      </div>
      <div class="row2">
        <div class="field">
          <label for="plz">Postleitzahl *</label>
          <input id="plz" name="plz" value="${esc(order.plz)}">
        </div>
        <div class="field">
          <label for="ort">Ort *</label>
          <input id="ort" name="ort" value="${esc(order.ort)}">
        </div>
      </div>
      <div class="row2">
        <div class="field">
          <label for="email">E-Mail *</label>
          <input id="email" name="email" type="email" value="${esc(order.email)}">
        </div>
        <div class="field">
          <label for="telefon">Telefon *</label>
          <input id="telefon" name="telefon" value="${esc(order.telefon)}">
        </div>
      </div>
      <div class="field">
        <label for="anliegen">Worum geht es? *</label>
        <textarea id="anliegen" name="anliegen">${esc(order.anliegen)}</textarea>
      </div>
      <div class="field">
        <label for="montagetermin">Termin *</label>
        <input id="montagetermin" name="montagetermin" type="datetime-local" step="900" value="${order.montagetermin ? esc(order.montagetermin.slice(0,16)) : ''}">
      </div>
      <div class="field">
        <label>Benötigtes Aufmaß</label>
        <p style="font-size:12px; color:var(--ink-light); margin:0 0 6px 0;">Falls sich vor Ort herausstellt, dass etwas anderes gebraucht wird als ursprünglich gedacht.</p>
        <div style="display:flex; gap:18px; flex-wrap:wrap;">
          <label class="checkbox-label"><input type="checkbox" id="edit_aufmass_rollladen" ${order.aufmassBenoetigt ? 'checked' : ''}> Aufmaß Rollladen</label>
          <label class="checkbox-label"><input type="checkbox" id="edit_aufmass_markise" ${order.aufmassMarkiseBenoetigt ? 'checked' : ''}> Aufmaß Markise</label>
          <label class="checkbox-label"><input type="checkbox" id="edit_aufmass_tuchwechsel" ${order.aufmassTuchwechselBenoetigt ? 'checked' : ''}> Aufmaß Tuchwechsel</label>
        </div>
      </div>
      <div class="field">
        <label>Zuständiges Team</label>
        <div class="row2">
          <div class="field">
            <label for="edit_mitarbeiter1">Mitarbeiter 1</label>
            <select id="edit_mitarbeiter1" name="edit_mitarbeiter1" style="width:100%; padding:9px 11px; border:1px solid var(--line-strong); border-radius:4px; background:var(--paper); color:var(--ink); font-family:'Work Sans', sans-serif; font-size:14px;">
              <option value="">— keiner —</option>
              ${DATA.mitarbeiterListe.map(m => `<option value="${esc(m)}" ${(order.zustaendig||'').split(' & ')[0] === m ? 'selected' : ''}>${esc(m)}</option>`).join('')}
            </select>
          </div>
          <div class="field">
            <label for="edit_mitarbeiter2">Mitarbeiter 2</label>
            <select id="edit_mitarbeiter2" name="edit_mitarbeiter2" style="width:100%; padding:9px 11px; border:1px solid var(--line-strong); border-radius:4px; background:var(--paper); color:var(--ink); font-family:'Work Sans', sans-serif; font-size:14px;">
              <option value="">— keiner —</option>
              ${DATA.mitarbeiterListe.map(m => `<option value="${esc(m)}" ${(order.zustaendig||'').split(' & ')[1] === m ? 'selected' : ''}>${esc(m)}</option>`).join('')}
            </select>
          </div>
        </div>
      </div>
      <div class="ticket-actions">
        <button type="submit" class="btn btn-primary">Speichern</button>
        <button type="button" class="btn btn-no" onclick="loescheAuftragBestaetigen('${order.id}')">Auftrag löschen</button>
      </div>
    </form>
  `;
}

function viewMontageListe(){
  const orders = DATA.orders
    .filter(o => o.status !== 'fertig' && !o.nurAufmass && o.zustaendig && !hatOffeneAufmasse(o) && !(!o.montagetermin && !o.terminBestaetigt) && !(o.angebote||[]).some(a => !a.done))
    .sort((a,b) => (a.montagetermin||'').localeCompare(b.montagetermin||''));

  if(orders.length === 0){
    return `
      <h1 class="view-title">Aufträge & Montage</h1>
      <p class="view-sub">Offene Aufträge und laufende Montagen.</p>
      <div class="empty">Keine offenen Aufträge. Leg unter „Neuer Auftrag" einen an.</div>
    `;
  }

  return `
    <h1 class="view-title">Aufträge & Montage</h1>
    <p class="view-sub">Montagebericht ausfüllen, sobald ein Termin erledigt wurde.</p>
    ${orders.map(ticketCard).join('')}
  `;
}

function ermittleTerminTyp(o){
  const offeneAufmasse = [];
  if(o.aufmassBenoetigt && !o.aufmass) offeneAufmasse.push('Rollladen');
  if(o.aufmassMarkiseBenoetigt && !o.aufmassMarkise) offeneAufmasse.push('Markise');
  if(o.aufmassTuchwechselBenoetigt && !o.aufmassTuchwechsel) offeneAufmasse.push('Tuchwechsel');
  if(offeneAufmasse.length > 0){
    return { label: 'Aufmaß-Termin: ' + offeneAufmasse.join(', '), farbe: '#2F8F80' };
  }
  return { label: 'Montageauftrag', farbe: '#3E6C8C' };
}

function formatAufmassPosition(p){
  const details = [];
  if(p.material) details.push(p.material === 'aluminium' ? 'Aluminium' : 'Kunststoff');
  if(p.panzer) details.push(p.panzer === 'mini' ? 'Mini-Panzer' : 'Maxi-Panzer');
  if(p.farbe) details.push('Farbe: ' + p.farbe);
  if(p.stopper) details.push('Stopper: ' + (p.stopper === 'ja' ? 'Ja' : 'Nein'));
  let line = `<strong>${esc(p.bezeichnung) || 'Position'}:</strong> ${esc(p.masse) || '–'}`;
  if(details.length > 0) line += ' · ' + details.map(esc).join(' · ');
  if(p.bemerkung) line += ' · ' + esc(p.bemerkung);
  return line;
}

function formatAufmassPositionPlain(p){
  const details = [];
  if(p.material) details.push(p.material === 'aluminium' ? 'Aluminium' : 'Kunststoff');
  if(p.panzer) details.push(p.panzer === 'mini' ? 'Mini-Panzer' : 'Maxi-Panzer');
  if(p.farbe) details.push('Farbe: ' + p.farbe);
  if(p.stopper) details.push('Stopper: ' + (p.stopper === 'ja' ? 'Ja' : 'Nein'));
  let line = (p.bezeichnung || 'Position') + ': ' + (p.masse || '–');
  if(details.length > 0) line += ' · ' + details.join(' · ');
  if(p.bemerkung) line += ' · ' + p.bemerkung;
  return line;
}

function formatMarkisePosition(p, idx){
  const details = [];
  if(p.markisentyp) details.push('Typ: ' + p.markisentyp);
  if(p.antrieb){
    const antriebLabel = {kurbel:'Kurbel', motor:'Motor', funkmotor_io:'Funkmotor IO', funkmotor_rts:'Funkmotor RTS'}[p.antrieb] || p.antrieb;
    details.push('Antrieb: ' + antriebLabel + (p.antrieb === 'kurbel' && p.kurbellaenge ? ' (' + p.kurbellaenge + ' mm)' : ''));
  }
  if(p.gestellfarbe){
    const farbe = p.gestellfarbe === 'sonder' ? (p.sonderfarbe || 'Sonderfarbe') : p.gestellfarbe.toUpperCase();
    details.push('Gestellfarbe: ' + farbe);
  }
  if(p.dessin) details.push('Dessin: ' + p.dessin);
  if(p.schutzdach) details.push(p.schutzdach === 'mit' ? 'mit Schutzdach' : 'ohne Schutzdach');
  if(p.montageart){
    const montageLabel = {wand:'Wand', decke:'Decke', dachsparren:'Dachsparren'}[p.montageart] || p.montageart;
    details.push('Montage: ' + montageLabel);
  }
  if(p.untergrund){
    const untergrundLabel = {beton:'Beton C 20/25', mauerziegel:'Mauerziegel/KS Vollstein', hohlblockstein:'Hohlblockstein', porenbeton:'Porenbeton', hochlochziegel:'Hochlochziegel/KS Lochstein', holzbalken:'Holzbalken', druckfest:'druckfest', nicht_druckfest:'nicht druckfest' + (p.untergrundDistanz ? ' (Distanz ' + p.untergrundDistanz + ' mm)' : '')}[p.untergrund] || p.untergrund;
    details.push('Untergrund: ' + untergrundLabel);
  }
  if(p.schalterNoetig) details.push('Schalter nötig: ' + (p.schalterNoetig === 'ja' ? 'Ja' : 'Nein'));
  if(p.stromverlegung) details.push('Stromverlegung: ' + (p.stromverlegung === 'ja' ? 'Ja (' + (p.stromverlegungMeter || '?') + ')' : 'Nein'));
  if(p.demontageAltmarkise) details.push('Demontage Altmarkise: ' + (p.demontageAltmarkise === 'ja' ? 'Ja' : 'Nein'));
  if(p.geschaetzterZeitaufwand) details.push('Zeitaufwand Strom: ' + p.geschaetzterZeitaufwand);

  let line = `<strong>Anlage ${idx + 1}${p.aufmass || p.ausfall ? ':' : ''}</strong>`;
  if(p.aufmass || p.ausfall) line += ` Aufmaß ${esc(p.aufmass) || '–'} mm, Ausfall ${esc(p.ausfall) || '–'} mm`;
  if(details.length > 0) line += (line.endsWith('</strong>') ? ' ' : ' · ') + details.map(esc).join(' · ');
  if(p.sonstiges) line += ' · ' + esc(p.sonstiges);
  if(p.bemerkung) line += ' · ' + esc(p.bemerkung);
  return line;
}

function formatTuchwechselPosition(p, idx){
  const details = [];
  if(p.breite || p.hoehe) details.push('Breite ' + (esc(p.breite) || '–') + ' mm x Ausfall ' + (esc(p.hoehe) || '–') + ' mm');
  if(p.stoffnummer) details.push('Stoff-Nr.: ' + esc(p.stoffnummer));
  if(p.volantform){
    const volantformLabel = {gerade:'gerade', kleine_welle:'kleine Welle', lange_welle:'lange Welle'}[p.volantform] || p.volantform;
    details.push('Volantform: ' + volantformLabel);
  }
  if(p.magnetkrallenkeder) details.push('Magnetkrallenkeder: ' + (p.magnetkrallenkeder === 'ja' ? 'Ja' : 'Nein'));
  let line = `<strong>Position ${idx + 1}:</strong>`;
  if(details.length > 0) line += ' ' + details.join(' · ');
  if(p.bemerkung) line += ' · ' + esc(p.bemerkung);
  return line;
}

function dauerMinuten(von, bis){
  if(!von || !bis) return 0;
  const [vh, vm] = von.split(':').map(Number);
  const [bh, bm] = bis.split(':').map(Number);
  let minutes = (bh*60+bm) - (vh*60+vm);
  if(minutes < 0) minutes += 24*60;
  return minutes;
}

function formatMinuten(minutes){
  const h = Math.floor(minutes/60);
  const m = minutes % 60;
  return `${h} Std${m > 0 ? ' ' + m + ' Min' : ''}`;
}

function formatMontageEintrag(entry, index){
  const dauer = dauerMinuten(entry.von, entry.bis);
  const zeit = entry.von && entry.bis ? `${esc(entry.von)}–${esc(entry.bis)} Uhr (${formatMinuten(dauer)})` : '–';
  let line = `<strong>Einsatz ${index+1}${entry.datum ? ' · ' + fmtDateTime(entry.datum) : ''}:</strong> ${zeit}`;
  if(entry.anfahrt) line += ' · Anfahrt: ' + esc(entry.anfahrt);
  if(entry.material) line += ' · Material: ' + esc(entry.material);
  if(entry.notizen) line += ' · ' + esc(entry.notizen);
  if(entry.mitarbeiter) line += ' · ' + esc(entry.mitarbeiter);
  return line;
}

function summeStundenHistorie(historie){
  return (historie||[]).reduce((sum, e) => sum + dauerMinuten(e.von, e.bis), 0);
}

function minutenDiesenMonat(mitarbeiter){
  const heute = new Date();
  const jahr = heute.getFullYear();
  const monat = heute.getMonth();
  let minuten = 0;
  DATA.orders.forEach(o => {
    (o.montageHistorie || []).forEach(e => {
      if(e.mitarbeiter !== mitarbeiter || !e.datum) return;
      const d = new Date(e.datum);
      if(d.getFullYear() === jahr && d.getMonth() === monat){
        minuten += dauerMinuten(e.von, e.bis);
      }
    });
  });
  return minuten;
}

async function setzeSollStunden(wert){
  const zahl = parseFloat(wert);
  DATA.sollStundenProMonat = isNaN(zahl) || zahl <= 0 ? 160 : zahl;
  await saveData();
  render();
}

function druckeAuftrag(orderId){
  const o = DATA.orders.find(x => x.id === orderId);
  if(!o) return;
  const win = window.open('', '_blank');
  if(!win) return;
  const historieHtml = (o.montageHistorie||[]).map((e,i) => `<p>${formatMontageEintrag(e,i)}</p>`).join('') || '<p>Keine Einsätze erfasst.</p>';
  const aufmassHtml = o.aufmass ? `
    <h3>Aufmaß</h3>
    ${o.aufmass.positionen.map(p => `<p>${formatAufmassPosition(p)}</p>`).join('')}
    ${o.aufmass.geschaetzterAufwand ? `<p>Geschätzter Montageaufwand: ${esc(o.aufmass.geschaetzterAufwand)}</p>` : ''}
    ${o.aufmass.besondereTaetigkeiten ? `<p>Besondere Tätigkeiten: ${esc(o.aufmass.besondereTaetigkeiten)}</p>` : ''}
  ` : '';
  const gesamt = formatMinuten(summeStundenHistorie(o.montageHistorie));
  win.document.write(`<!DOCTYPE html><html><head><title>Auftrag ${auftragsNummer(o)}</title>
    <meta charset="utf-8">
    <style>
      body{font-family:Arial,sans-serif; padding:32px; color:#222; max-width:700px;}
      h1{margin-bottom:2px;}
      h3{margin-top:26px; border-bottom:1px solid #ccc; padding-bottom:4px;}
      p{margin:4px 0; line-height:1.5;}
      .meta{color:#555;}
    </style></head><body>
    <h1>Auftrag Nr. ${auftragsNummer(o)}</h1>
    <p class="meta">${o.erfasstVon ? 'Erfasst von ' + esc(o.erfasstVon) : ''}</p>
    <h3>Kunde</h3>
    <p><strong>${esc(anzeigeName(o))}</strong><br>${esc(o.strasse)}<br>${esc(o.plz)} ${esc(o.ort)}<br>Telefon: ${esc(o.telefon) || '–'}${o.email ? '<br>E-Mail: ' + esc(o.email) : ''}</p>
    <p>Anliegen: ${esc(o.anliegen) || '–'}</p>
    <p>Montagetermin: ${fmtDateTime(o.montagetermin)}</p>
    ${aufmassHtml}
    <h3>Montage</h3>
    ${historieHtml}
    <p><strong>Gesamtstunden: ${gesamt}</strong></p>
    ${o.kundenunterschrift ? `
      <h3>Kundenunterschrift</h3>
      <img src="${o.kundenunterschrift}" style="max-width:300px; border:1px solid #ccc;">
    ` : ''}
    </body></html>`);
  win.document.close();
  win.focus();
  setTimeout(() => win.print(), 300);
}

let pendingArchivBestaetigungId = null;
let pendingArchivLoeschenId = null;

function archivierenBestaetigen(orderId){
  pendingArchivBestaetigungId = orderId;
  render();
}

async function markiereAlsAbgeschlossen(orderId){
  const order = DATA.orders.find(o => o.id === orderId);
  if(!order) return;
  order.archiviert = true;
  order.archiviertAm = new Date().toISOString();
  order.archiviertVon = currentUser;
  pendingArchivBestaetigungId = null;
  await saveData();

  render();

function aufmassFarbOptionen(pos){

  const optionen = pos.material === 'aluminium' ? ALUMINIUM_FARBEN : KUNSTSTOFF_FARBEN;
  return optionen.map(f => toggleBtn(pos.id, 'farbe', f, f, pos.farbe)).join('');
}

function toggleBtn(posId, field, value, label, current){
  const active = current === value;
  return `<button type="button" class="toggle-pill ${active ? 'active' : ''}" onclick="setAufmassField('${posId}','${field}','${value}')">${esc(label)}</button>`;

function oeffnePassendesAufmass(orderId){
  const order = DATA.orders.find(o => o.id === orderId);
  if(!order) return;
  if(order.aufmassMarkise){ setView('aufmassMarkise'); openMarkiseAufmass(orderId); }
  else if(order.aufmassTuchwechsel){ setView('aufmassTuchwechsel'); openTuchwechselAufmass(orderId); }
  else if(order.aufmass){ setView('aufmass'); openAufmass(orderId); }
  else if(order.aufmassMarkiseBenoetigt){ setView('aufmassMarkise'); openMarkiseAufmass(orderId); }
  else if(order.aufmassTuchwechselBenoetigt){ setView('aufmassTuchwechsel'); openTuchwechselAufmass(orderId); }
  else { setView('aufmass'); openAufmass(orderId); }
}

function druckeAufmass(orderId){
  const o = DATA.orders.find(x => x.id === orderId);
  if(!o) return;
  const win = window.open('', '_blank');
  if(!win) return;

  let abschnitte = '';

  if(o.aufmass && o.aufmass.positionen && o.aufmass.positionen.length > 0){
    abschnitte += `<h3>Aufmaß Rollladen</h3>`;
    abschnitte += o.aufmass.positionen.map(p => `<p>${formatAufmassPosition(p)}</p>`).join('');
    if(o.aufmass.geschaetzterAufwand) abschnitte += `<p>Geschätzter Montageaufwand: ${esc(o.aufmass.geschaetzterAufwand)}</p>`;
    if(o.aufmass.besondereTaetigkeiten) abschnitte += `<p>Besondere Tätigkeiten: ${esc(o.aufmass.besondereTaetigkeiten)}</p>`;
    if(o.aufmass.notiz) abschnitte += `<p>Notizen: ${esc(o.aufmass.notiz)}</p>`;
  }

  if(o.aufmassMarkise && o.aufmassMarkise.positionen && o.aufmassMarkise.positionen.length > 0){
    abschnitte += `<h3>Aufmaß Markise</h3>`;
    abschnitte += o.aufmassMarkise.positionen.map((p,i) => `<p>${formatMarkisePosition(p,i)}</p>`).join('');
    if(o.aufmassMarkise.notiz) abschnitte += `<p>Notizen: ${esc(o.aufmassMarkise.notiz)}</p>`;
  }

  if(o.aufmassTuchwechsel && o.aufmassTuchwechsel.positionen && o.aufmassTuchwechsel.positionen.length > 0){
    abschnitte += `<h3>Aufmaß Tuchwechsel</h3>`;
    abschnitte += o.aufmassTuchwechsel.positionen.map((p,i) => `<p>${formatTuchwechselPosition(p,i)}</p>`).join('');
    if(o.aufmassTuchwechsel.notiz) abschnitte += `<p>Notizen: ${esc(o.aufmassTuchwechsel.notiz)}</p>`;
  }

  if(!abschnitte) abschnitte = '<p>Kein Aufmaß erfasst.</p>';

  win.document.write(`<!DOCTYPE html><html><head><title>Aufmaß ${auftragsNummer(o)}</title>
    <meta charset="utf-8">
    <style>
      body{font-family:Arial,sans-serif; padding:32px; color:#222; max-width:700px;}
      h1{margin-bottom:2px;}
      h3{margin-top:26px; border-bottom:1px solid #ccc; padding-bottom:4px;}
      p{margin:4px 0; line-height:1.5;}
      .meta{color:#555;}
    </style></head><body>
    <h1>Aufmaß · Auftrag Nr. ${auftragsNummer(o)}</h1>
    <p class="meta">${o.erfasstVon ? 'Erfasst von ' + esc(o.erfasstVon) : ''}</p>
    <h3>Kunde</h3>
    <p><strong>${esc(anzeigeName(o))}</strong><br>${esc(o.strasse)}<br>${esc(o.plz)} ${esc(o.ort)}<br>Telefon: ${esc(o.telefon) || '–'}${o.email ? '<br>E-Mail: ' + esc(o.email) : ''}</p>
    <p>Anliegen: ${esc(o.anliegen) || '–'}</p>
    ${abschnitte}
    </body></html>`);
  win.document.close();
  win.focus();
  setTimeout(() => win.print(), 300);
}

      ${order.aufmass.positionen.map(p => `<div class="ticket-anliegen" style="font-size:13px; margin-bottom:3px;">${formatAufmassPosition(p)}</div>`).join('')}
    </div>`;
  }
  if(order.aufmassMarkise && order.aufmassMarkise.positionen && order.aufmassMarkise.positionen.length > 0){
    html += `<div style="margin-top:6px; padding:8px 10px; background:var(--panel-raised); border-radius:5px;">
      <div style="font-size:12px; font-weight:600; color:var(--ink-light); margin-bottom:4px;">Aufmaß Markise</div>
      ${order.aufmassMarkise.positionen.map((p,i) => `<div class="ticket-anliegen" style="font-size:13px; margin-bottom:3px;">${formatMarkisePosition(p,i)}</div>`).join('')}
    </div>`;
  }
  if(order.aufmassTuchwechsel && order.aufmassTuchwechsel.positionen && order.aufmassTuchwechsel.positionen.length > 0){
    html += `<div style="margin-top:6px; padding:8px 10px; background:var(--panel-raised); border-radius:5px;">
      <div style="font-size:12px; font-weight:600; color:var(--ink-light); margin-bottom:4px;">Aufmaß Tuchwechsel</div>

              <select id="na-anrede" name="anrede">
                <option value="">— bitte wählen —</option>
                ${ANREDE_OPTIONEN.map(a => `<option value="${a}">${a}</option>`).join('')}
              </select>
            </div>
            <div class="field">
              <label for="na-name">Name *</label>
              <input id="na-name" name="name" list="kunden-vorschlaege-na" oninput="autofuelleAusKundenstamm(this.value, 'na-')">
              <datalist id="kunden-vorschlaege-na">
                ${DATA.kunden.slice(0, 3000).map(k => `<option value="${esc(k.name)}">`).join('')}
              </datalist>
            </div>
          </div>
          <div class="field">
            <label for="na-strasse">Straße & Hausnummer *</label>
            <input id="na-strasse" name="strasse">
          </div>
          <div class="row2">
            <div class="field">
              <label for="na-plz">Postleitzahl *</label>
              <input id="na-plz" name="plz" inputmode="numeric" maxlength="5">
            </div>
            <div class="field">
              <label for="na-ort">Ort *</label>
              <input id="na-ort" name="ort">
            </div>
          </div>
          <div class="row2">
            <div class="field">
              <label for="na-telefon">Telefon</label>
              <input id="na-telefon" name="telefon">
            </div>
            <div class="field">
              <label for="na-email">E-Mail</label>
              <input id="na-email" name="email" type="email">
            </div>
          </div>
          <div class="field">
            <label for="na-material">Was wurde bestellt? *</label>
            <textarea id="na-material" name="material" placeholder="z. B. Markise Typ G100, 4x3m, RAL 7016"></textarea>
          </div>
          <div class="row2">
            <div class="field">
              <label for="na-wareneingang">Erwartetes Wareneingangsdatum (optional)</label>
              <input id="na-wareneingang" name="wareneingang" type="date">
            </div>
          </div>
          <div class="field">
            <label>Zuständiges Team *</label>
            <div class="row2">
              <div class="field">
                <label for="na-mitarbeiter1">Mitarbeiter 1</label>
                <select id="na-mitarbeiter1" name="mitarbeiter1">
                  <option value="">— bitte wählen —</option>
                  ${DATA.mitarbeiterListe.map(m => `<option value="${esc(m)}">${esc(m)}</option>`).join('')}
                </select>
              </div>
              <div class="field">
                <label for="na-mitarbeiter2">Mitarbeiter 2 (optional)</label>
                <select id="na-mitarbeiter2" name="mitarbeiter2">
                  <option value="">— keiner —</option>
                  ${DATA.mitarbeiterListe.map(m => `<option value="${esc(m)}">${esc(m)}</option>`).join('')}
                </select>
              </div>
            </div>
          </div>
          <div class="ticket-actions">
            <button type="submit" class="btn btn-primary">Auftrag anlegen</button>
            <button type="button" class="btn btn-ghost" onclick="zeigeNacherfassung = false; render();">Abbrechen</button>
          </div>
        </form>
      </div>
    </div>
  `;
}

function viewWartenListe(){
  const orders = openWarten();
  if(orders.length === 0){
    return `
      <h1 class="view-title">Warten auf Material</h1>
      <p class="view-sub">Aufträge, die auf bestelltes Material warten.</p>
      ${renderNacherfassungFormular()}
      <div class="empty">Aktuell nichts offen.</div>
    `;
  }
  return `
    <h1 class="view-title">Warten auf Material</h1>
    <p class="view-sub">Aufträge, die auf bestelltes Material warten.</p>
    ${renderNacherfassungFormular()}
    <div class="ticket"><div class="ticket-inner">
      ${orders.map(o => {
        const bestellteMaterialien = (o.bestellungen||[]).filter(b => b.done).map(b => b.text).join(', ');
        return `
        <div class="todo-row">
          <input type="checkbox" onchange="materialEingetroffen('${o.id}')">
          <div style="flex:1;">
            <div class="todo-text">${esc(o.name)} – Material eingetroffen</div>
            <div class="todo-context">${o.istAllgemein
              ? 'Allgemeine Bestellung' + (bestellteMaterialien ? ' · Material: ' + esc(bestellteMaterialien) : '')
              : `Auftrag Nr. ${auftragsNummer(o)} · ${esc(o.name)}, ${esc(o.ort)}${bestellteMaterialien ? ' · Material: ' + esc(bestellteMaterialien) : ''}${o.zustaendig ? ' · Zuständig: ' + esc(o.zustaendig) : ''}
              — <a href="#" onclick="event.preventDefault(); setView('montage'); openReport('${o.id}');">Zum Montagebericht</a>`}
            </div>
            <div style="display:flex; align-items:center; gap:8px; margin-top:6px;">
              <label style="font-size:12.5px; color:var(--ink-light);" for="wareneingang-${o.id}">Erwartetes Wareneingangsdatum:</label>
              <input type="date" id="wareneingang-${o.id}" value="${esc(o.erwartetesWareneingangsdatum || '')}" onchange="setzeWareneingangsdatum('${o.id}', this.value)" style="padding:5px 8px; border:1px solid var(--line-strong); border-radius:4px; background:var(--paper); color:var(--ink); font-family:'Work Sans', sans-serif; font-size:12.5px;">
            </div>
            <button type="button" class="btn btn-ghost btn-small" style="margin-top:8px;" onclick="zurueckZuBestellung('${o.id}')">← Zurück zur Bestellung</button>
            ${renderAufmassZusammenfassung(o)}
          </div>
        </div>
      `;}).join('')}
    </div></div>
  `;
}

function viewMitarbeiterAufgaben(){
  return `
    <h1 class="view-title">Mitarbeiter-Aufgaben</h1>
    <p class="view-sub">Aufgaben pro Mitarbeiter, die noch erledigt werden müssen.</p>
    <div style="display:grid; grid-template-columns:repeat(auto-fit, minmax(260px, 1fr)); gap:16px;">
      ${DATA.mitarbeiterListe.map(m => {
        const aufgaben = DATA.mitarbeiterAufgaben[m] || [];
        const offen = aufgaben.filter(a => !a.done).length;
        return `
        <div class="aufmass-card" style="margin-bottom:0;">
          <div class="aufmass-card-head">
            <span class="aufmass-card-num">${esc(m)}${offen > 0 ? ` (${offen} offen)` : ''}</span>
          </div>
          ${aufgaben.length === 0 ? `<p style="font-size:13px; color:var(--ink-light); margin:8px 0;">Keine Aufgaben.</p>` : aufgaben.map(a => { const ueberfaellig = a.faelligAm && !a.done && new Date(a.faelligAm) < new Date(new Date().toDateString()); return `
            <div class="todo-row" style="padding:8px 0; align-items:flex-start;">
              <input type="checkbox" ${a.done ? 'checked' : ''} onchange="toggleMitarbeiterAufgabe('${m}','${a.id}')" style="margin-top:9px;">
              <div style="flex:1;">
                <div class="todo-text" style="${a.done ? 'text-decoration:line-through; color:var(--ink-light);' : ''}">${esc(a.text)}</div>
                ${a.faelligAm ? `<div class="todo-context" style="${ueberfaellig ? 'color:var(--rust); font-weight:600;' : ''}">${ueberfaellig ? 'Überfällig – ' : 'Fällig: '}${new Date(a.faelligAm).toLocaleDateString('de-DE')}</div>` : ''}
                ${a.erstelltVon ? `<div class="todo-context">von ${esc(a.erstelltVon)}</div>` : ''}
                <input value="${esc(a.notiz || '')}" placeholder="Was wurde gemacht?" onchange="updateMitarbeiterAufgabeNotiz('${m}','${a.id}', this.value)" style="width:100%; margin-top:6px; padding:5px 8px; border:1px solid var(--line-strong); border-radius:4px; background:var(--paper); color:var(--ink); font-family:'Work Sans', sans-serif; font-size:12.5px;">
              </div>
              <button class="btn-remove-row" title="Aufgabe löschen" onclick="removeMitarbeiterAufgabe('${m}','${a.id}')">✕</button>
            </div>
          `;}).join('')}
          <div style="display:flex; gap:6px; margin-top:12px; flex-wrap:wrap;">
            <input id="aufgabe-input-${m}" placeholder="Neue Aufgabe …" style="flex:1; min-width:120px; padding:7px 9px; border:1px solid var(--line-strong); border-radius:4px; background:var(--paper); color:var(--ink); font-family:'Work Sans', sans-serif; font-size:13.5px;" onkeydown="if(event.key==='Enter'){event.preventDefault(); addMitarbeiterAufgabeClick('${m}');}">
            <input type="date" id="aufgabe-faellig-${m}" title="Bis wann? (optional)" style="padding:7px 9px; border:1px solid var(--line-strong); border-radius:4px; background:var(--paper); color:var(--ink); font-family:'Work Sans', sans-serif; font-size:13.5px;">
            <button class="btn btn-primary btn-small" onclick="addMitarbeiterAufgabeClick('${m}')">+ Hinzufügen</button>
          </div>
        </div>
      `;}).join('')}
    </div>
  `;
}

function viewBereitListe(){
  const orders = openBereitZurTerminierung();
  if(orders.length === 0){
    return `
      <h1 class="view-title">Terminieren-Material eingetroffen</h1>
      <p class="view-sub">Aufträge, deren Material da ist und die nur noch einen Montagetermin brauchen.</p>
      <div class="empty">Aktuell nichts offen.</div>
    `;
  }
  return `
    <h1 class="view-title">Terminieren-Material eingetroffen</h1>
    <p class="view-sub">Aufträge, deren Material da ist und die nur noch einen Montagetermin brauchen.</p>
    <div class="ticket"><div class="ticket-inner">
      ${orders.map(o => `
        <div class="aufmass-card">
          <div class="aufmass-card-head">
            <span class="aufmass-card-num">Auftrag Nr. ${auftragsNummer(o)} · ${esc(o.name)}</span>
          </div>
          <div class="ticket-meta" style="margin-bottom:10px;">
            <div><span>Ort: </span>${esc(o.plz)} ${esc(o.ort)}, ${esc(o.strasse)}</div>
            <div><span>Telefon: </span>${esc(o.telefon) || '–'}</div>
          </div>
          <div id="bereit-error-${o.id}" style="display:none; background:var(--rust-bg); color:var(--rust); border-radius:5px; padding:8px 12px; font-size:13px; margin-bottom:10px;"></div>
          <div class="field">
            <label for="bereit-termin-${o.id}">Neuer Montagetermin</label>
            <div style="display:flex; gap:8px; align-items:center; flex-wrap:wrap;">
              <input id="bereit-termin-${o.id}" type="datetime-local" step="900" value="${o.montagetermin ? esc(o.montagetermin.slice(0,16)) : ''}" style="flex:1; min-width:180px;">
              <button type="button" class="btn btn-ghost btn-small" onclick="oeffneBereitWochenansicht('${o.id}')">Wochenübersicht ansehen ↗</button>
              <button type="button" class="btn btn-ghost btn-small" onclick="oeffneBereitInGCal('${o.id}')">Google Kalender ↗</button>
            </div>
          </div>
          <div class="checkbox-field" style="margin:10px 0;">
            <label class="checkbox-label">
              <input type="checkbox" id="bereit-bestaetigt-${o.id}">
              Termin in Google Kalender geprüft und bestätigt
            </label>
          </div>
          <div class="ticket-actions" style="margin-top:10px;">
            <button class="btn btn-primary btn-small" onclick="neuenTerminSpeichernUndAbschliessen('${o.id}')">Termin gespeichert – abschließen</button>
            <a href="#" onclick="event.preventDefault(); setView('montage'); openReport('${o.id}');" style="align-self:center; font-size:13px;">Zum Montagebericht</a>
            <button type="button" class="btn btn-ghost btn-small" onclick="zurueckZuWartenAufMaterial('${o.id}')">← Zurück zu Warten auf Material</button>
          </div>
        </div>
      `).join('')}
    </div></div>
  `;
}

if('serviceWorker' in navigator){
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('service-worker.js').catch(e => console.log('Service Worker Registrierung fehlgeschlagen:', e));
  });
}

loadFreischaltung();
loadData();
loadUser();
</script>
</body>
</html>
